name: APK de Michi Araña

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MichiArana.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MichiArana-apk
          path: MichiArana.apk

      # Publica la APK en «Releases» para descargarla directo desde la tablet
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: michi-apk
          name: Michi Araña (APK para Android)
          prerelease: true
          files: MichiArana.apk
          body: |
            Descarga **MichiArana.apk** desde la tablet Android, ábrela e instálala
            (permite «instalar apps desconocidas» si te lo pide). Luego sigue los pasos dentro de la app.
