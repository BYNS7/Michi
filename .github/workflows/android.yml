name: APK de BYNS

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Probar el dibujo del avatar
        continue-on-error: true
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avatar-preview
          path: android/app/build/avatars/

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BYNS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BYNS-apk
          path: BYNS.apk

      # Publica la APK en «Releases» para descargarla directo desde la tablet
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: byns-apk
          name: BYNS (APK para Android)
          prerelease: true
          files: |
            BYNS.apk
            android/app/build/avatars/avatars.png
          body: |
            Descarga **BYNS.apk** desde la tablet Android, ábrela e instálala
            (permite «instalar apps desconocidas» si te lo pide). Luego sigue los pasos dentro de la app.
