name: Herramientas de prueba (temporal)

on:
  push:
    paths:
      - ".github/workflows/devtools.yml"

permissions:
  contents: write

jobs:
  jars:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar dependencias AndroidX de Robolectric
        run: |
          mkdir -p dl/jars && cd dl
          G=https://dl.google.com/android/maven2
          get() { curl -fsSL -o "tmp.$3" "$G/$1/$2.$3"; if [ "$3" = aar ]; then unzip -p tmp.aar classes.jar > "jars/$(basename $2).jar"; else mv tmp.jar "jars/$(basename $2).jar"; fi; }
          get androidx/test/monitor/1.7.2 monitor-1.7.2 aar
          get androidx/test/espresso/espresso-idling-resource/3.6.1 espresso-idling-resource-3.6.1 aar
          get androidx/tracing/tracing/1.1.0 tracing-1.1.0 aar
          get androidx/annotation/annotation-jvm/1.8.0 annotation-jvm-1.8.0 jar
          get androidx/annotation/annotation-experimental/1.4.1 annotation-experimental-1.4.1 aar
          get androidx/concurrent/concurrent-futures/1.1.0 concurrent-futures-1.1.0 jar
          ls -la jars
          zip -j androidx-test-jars.zip jars/*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: devtools
          name: Herramientas de prueba (no instalar)
          prerelease: true
          files: dl/androidx-test-jars.zip
